[workspace]
members = ["crates/web", "crates/solvers", "crates/fhp", "crates/jacobi", "crates/lean-runtime", "crates/engine", "crates/engine-cli", "crates/life-models"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# rustc crashes (SIGBUS in LLVM's DWARF emission) on fhp's generated collision
# tables when they are built with full debug info.
[profile.dev.package.fhp]
debug = false

# fhp and jacobi's parity tests evaluate bit-sliced circuits over millions of
# lanes; unoptimized they take minutes.
[profile.test]
opt-level = 3
