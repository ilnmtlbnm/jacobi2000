[workspace]
members = ["crates/cli", "crates/web", "crates/jacobi2000", "crates/solvers", "crates/train", "crates/fhp", "crates/jacobi", "crates/lean-runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
burn = { version = "0.20", default-features = false, features = ["std"] }
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# fhp and jacobi's parity tests evaluate bit-sliced circuits over millions of
# lanes; unoptimized they take minutes (carried over from their source
# workspace in tritsliced).
[profile.test]
opt-level = 3
