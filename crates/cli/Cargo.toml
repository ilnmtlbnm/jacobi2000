[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jacobi"
path = "src/main.rs"

[features]
default = ["ndarray"]
# Backends are selected here, in the binary crate, never in the libraries.
ndarray = ["burn/ndarray"]
wgpu = ["burn/wgpu"]

[dependencies]
jacobi2000 = { path = "../jacobi2000" }
solvers = { path = "../solvers" }
train = { path = "../train" }
burn = { version = "0.20", default-features = false, features = ["std", "autodiff"] }
clap = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
