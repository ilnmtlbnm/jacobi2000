[package]
name = "engine-cli"
description = "Command-line tools for the engine crate: rollout (step a safetensors+config.json checkpoint against the reference solver), eval-metrics (score rollouts at several horizons) and dump-dataset (write solver trajectories for training)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rollout"
path = "src/main.rs"

[[bin]]
name = "eval-metrics"
path = "src/eval.rs"

[[bin]]
name = "dump-dataset"
path = "src/dump_dataset.rs"

[features]
default = []
# Both forward to engine's own features; see its Cargo.toml. threads is a
# build-time choice (rayon in or out); wgpu lets --backend webgpu run, with
# --backend auto/cpu still available in the same binary.
threads = ["engine/threads"]
wgpu = ["engine/wgpu", "dep:pollster"]

[dependencies]
engine = { path = "../engine" }
solvers = { path = "../solvers" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pollster = { version = "0.4", optional = true }
