<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="860" height="250" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <g fill="#f4f6fa" stroke="#1f5fbf" stroke-width="1.5">
    <rect x="20" y="60" width="140" height="70" rx="6"/>
    <rect x="200" y="60" width="160" height="70" rx="6"/>
    <rect x="400" y="60" width="200" height="70" rx="6"/>
    <rect x="640" y="60" width="200" height="70" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="90" y="85" font-weight="bold">lattice step</text>
    <text x="90" y="105">stream, collide</text>
    <text x="90" y="121" fill="#666">every step</text>
    <text x="280" y="85" font-weight="bold">block sums</text>
    <text x="280" y="105">mass, j_x, j_y, fluid</text>
    <text x="280" y="121" fill="#666">every 5 steps</text>
    <text x="500" y="85" font-weight="bold">integer fold</text>
    <text x="500" y="105">q += floor((u - q) a / 2^16)</text>
    <text x="500" y="121" fill="#666">a = 4389, half-life 50 steps</text>
    <text x="740" y="85" font-weight="bold">read-back and picture</text>
    <text x="740" y="105">vorticity of the block velocities</text>
    <text x="740" y="121" fill="#666">on request, one read in flight</text>
  </g>
  <g stroke="#555" stroke-width="1.5" marker-end="url(#a)">
    <line x1="160" y1="95" x2="198" y2="95"/>
    <line x1="360" y1="95" x2="398" y2="95"/>
    <line x1="600" y1="95" x2="638" y2="95"/>
  </g>
  <rect x="20" y="150" width="580" height="28" rx="4" fill="none" stroke="#999" stroke-dasharray="5 4"/>
  <text x="310" y="169" text-anchor="middle" fill="#444">stays on the device (GPU) or in the engine (CPU); integer only, identical on both</text>
  <text x="430" y="215" text-anchor="middle" fill="#444">The picture never waits for the simulation, and the simulation never waits for the picture.</text>
</svg>
