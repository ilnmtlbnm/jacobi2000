<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="720" height="300" fill="#ffffff"/>
  <!-- left: FHP, one bit per link -->
  <g transform="translate(150,150)">
    <text x="0" y="-125" text-anchor="middle" font-size="15" font-weight="bold">FHP: one bit per link</text>
    <g stroke="#555" stroke-width="2">
      <line x1="0" y1="0" x2="90" y2="0"/>
      <line x1="0" y1="0" x2="45" y2="-78"/>
      <line x1="0" y1="0" x2="-45" y2="-78"/>
      <line x1="0" y1="0" x2="-90" y2="0"/>
      <line x1="0" y1="0" x2="-45" y2="78"/>
      <line x1="0" y1="0" x2="45" y2="78"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#222"/>
    <!-- particles present on links 0 and 3 (head-on pair) -->
    <circle cx="60" cy="0" r="7" fill="#1f5fbf"/>
    <circle cx="-60" cy="0" r="7" fill="#1f5fbf"/>
    <text x="100" y="5">0 (E)</text>
    <text x="52" y="-86">1 (NE)</text>
    <text x="-98" y="-86">2 (NW)</text>
    <text x="-132" y="5">3 (W)</text>
    <text x="-100" y="100">4 (SW)</text>
    <text x="52" y="100">5 (SE)</text>
    <text x="0" y="122" text-anchor="middle" fill="#444">n_i = 0 or 1; rest channel 6 at the node</text>
  </g>
  <!-- right: signed ternary, a deviation per link -->
  <g transform="translate(540,150)">
    <text x="0" y="-125" text-anchor="middle" font-size="15" font-weight="bold">Signed ternary: a deviation per link</text>
    <g stroke="#555" stroke-width="2">
      <line x1="0" y1="0" x2="90" y2="0"/>
      <line x1="0" y1="0" x2="45" y2="-78"/>
      <line x1="0" y1="0" x2="-45" y2="-78"/>
      <line x1="0" y1="0" x2="-90" y2="0"/>
      <line x1="0" y1="0" x2="-45" y2="78"/>
      <line x1="0" y1="0" x2="45" y2="78"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#222"/>
    <g font-size="15" font-weight="bold" text-anchor="middle">
      <text x="62" y="-10" fill="#1f5fbf">+1</text>
      <text x="50" y="-50" fill="#888">0</text>
      <text x="-48" y="-50" fill="#c0392b">-1</text>
      <text x="-62" y="-10" fill="#888">0</text>
      <text x="-48" y="64" fill="#1f5fbf">+1</text>
      <text x="50" y="64" fill="#888">0</text>
    </g>
    <text x="0" y="122" text-anchor="middle" fill="#444">f_i = F_i(x) + delta_i, delta_i in {-1, 0, +1}</text>
    <text x="0" y="142" text-anchor="middle" fill="#444">F_i(x): the block reference, interpolated to the site</text>
  </g>
</svg>
