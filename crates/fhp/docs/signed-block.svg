<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="780" height="380" fill="#ffffff"/>
  <text x="390" y="24" text-anchor="middle" font-size="15" font-weight="bold">Per-block reference, interpolated to every site</text>
  <!-- four blocks of B x B sites -->
  <g transform="translate(30,50)">
    <g fill="none" stroke="#999" stroke-width="1.5">
      <rect x="0" y="0" width="150" height="130"/>
      <rect x="150" y="0" width="150" height="130"/>
      <rect x="0" y="130" width="150" height="130"/>
      <rect x="150" y="130" width="150" height="130"/>
    </g>
    <!-- site dots: even rows, odd rows shifted half a site -->
    <g fill="#ccc">
      <g id="row">
        <circle cx="12" cy="12" r="2.5"/><circle cx="37" cy="12" r="2.5"/><circle cx="62" cy="12" r="2.5"/><circle cx="87" cy="12" r="2.5"/><circle cx="112" cy="12" r="2.5"/><circle cx="137" cy="12" r="2.5"/>
        <circle cx="162" cy="12" r="2.5"/><circle cx="187" cy="12" r="2.5"/><circle cx="212" cy="12" r="2.5"/><circle cx="237" cy="12" r="2.5"/><circle cx="262" cy="12" r="2.5"/><circle cx="287" cy="12" r="2.5"/>
      </g>
      <use href="#row" transform="translate(12.5,22)"/>
      <use href="#row" transform="translate(0,44)"/>
      <use href="#row" transform="translate(12.5,66)"/>
      <use href="#row" transform="translate(0,88)"/>
      <use href="#row" transform="translate(12.5,110)"/>
      <use href="#row" transform="translate(0,132)"/>
      <use href="#row" transform="translate(12.5,154)"/>
      <use href="#row" transform="translate(0,176)"/>
      <use href="#row" transform="translate(12.5,198)"/>
      <use href="#row" transform="translate(0,220)"/>
      <use href="#row" transform="translate(12.5,242)"/>
    </g>
    <!-- block nodes at the centroids -->
    <g fill="#1f5fbf">
      <circle cx="78" cy="65" r="6"/><circle cx="228" cy="65" r="6"/>
      <circle cx="78" cy="195" r="6"/><circle cx="228" cy="195" r="6"/>
    </g>
    <g font-size="12" fill="#1f5fbf">
      <text x="88" y="58">(rho, j)_00</text><text x="238" y="58">(rho, j)_01</text>
      <text x="88" y="188">(rho, j)_10</text><text x="238" y="188">(rho, j)_11</text>
    </g>
    <!-- the site being interpolated -->
    <circle cx="162" cy="132" r="5" fill="#c0392b"/>
    <g stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3" fill="none">
      <line x1="78" y1="65" x2="162" y2="132"/><line x1="228" y1="65" x2="162" y2="132"/>
      <line x1="78" y1="195" x2="162" y2="132"/><line x1="228" y1="195" x2="162" y2="132"/>
    </g>
    <text x="170" y="150" font-size="12" fill="#c0392b">site x: F(x) = f_eq of the</text><text x="170" y="164" font-size="12" fill="#c0392b">bilinear blend of the four nodes</text>
    <text x="0" y="285" fill="#444">Blocks of B x B sites. Each block holds one density and one momentum (fixed point).</text>
    <text x="0" y="303" fill="#444">Odd rows sit half a site to the right; the block value is placed at the sites' centroid.</text>
  </g>
  <!-- right side: what a site holds -->
  <g transform="translate(420,60)">
    <text x="0" y="0" font-weight="bold">What one site stores</text>
    <text x="0" y="24" fill="#444">7 deviations delta_i in {-1, 0, +1}</text>
    <text x="0" y="42" fill="#444">(one u16 on the CPU, one u32 on the GPU)</text>
    <text x="0" y="74" font-weight="bold">What one block stores</text>
    <text x="0" y="98" fill="#444">rho, j_x, j_y in units of 2^-12 particles</text>
    <text x="0" y="116" fill="#444">a reservoir per channel (7 integers)</text>
    <text x="0" y="134" fill="#444">the number of fluid sites</text>
    <text x="0" y="166" font-weight="bold">What is represented</text>
    <text x="0" y="190" fill="#444">f_i(x) = F_i(x) + delta_i(x), plus the block's</text>
    <text x="0" y="208" fill="#444">reservoir spread over its fluid sites.</text>
    <text x="0" y="226" fill="#444">Summed over channels, sites and reservoirs,</text>
    <text x="0" y="244" fill="#444">mass and momentum are exact integers that</text>
    <text x="0" y="262" fill="#444">no step changes.</text>
  </g>
</svg>
