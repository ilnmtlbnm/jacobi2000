<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacobi bit-sliced (dev)</title>
<link rel="icon" href="data:,">
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  #panels { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  #panels figure { margin: 0; min-width: 0; }
  #panels canvas { width: 100%; image-rendering: pixelated; border: 1px solid #ccc; display: block; }
  #status { font-family: ui-monospace, monospace; margin: 8px 0; }
</style>
</head>
<body>
<button id="toggle" disabled>Start</button>
<button id="reset" disabled>Reset</button>
<label><input type="checkbox" id="error"> error vs analytic</label>
<label><input type="checkbox" id="round"> round to nearest</label>
<div id="status">loading</div>
<div id="panels"></div>
<script type="module">
// Dev page: the engine runs in a module worker (worker.js); this page only
// relays the controls and draws the RGBA frames it posts.
// ?n= grid size (default 512, rounded up by the engine), ?path=webgpu|cpu,
// ?problem=sinh for u = sin(pi x) sinh(pi y) / sinh(pi) (default x^2 - y^2).
const ENGINE_BUILD = '2026-10-06-physics-engine-01';
const worker = new Worker(`worker.js?v=${ENGINE_BUILD}`, { type: 'module' });
const panels = document.getElementById('panels');
const button = document.getElementById('toggle');
const reset = document.getElementById('reset');
const errorBox = document.getElementById('error');
const roundBox = document.getElementById('round');
const status = document.getElementById('status');
let running = false;
let canvases = [];
window.jac = { build: ENGINE_BUILD, frames: 0, ready: false, last: null };

worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === 'ready') {
    panels.textContent = '';
    canvases = m.names.map((name) => {
      const fig = document.createElement('figure');
      const cap = document.createElement('figcaption');
      cap.textContent = name;
      const c = document.createElement('canvas');
      c.width = c.height = m.size;
      fig.append(cap, c);
      panels.append(fig);
      return c;
    });
    button.disabled = reset.disabled = false;
    window.jac.ready = true;
    window.jac.path = m.path;
  } else if (m.type === 'frame') {
    m.images.forEach((buf, i) => {
      canvases[i].getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(buf), m.size, m.size), 0, 0);
    });
    window.jac.frames++;
    window.jac.last = m.stats;
  }
  if (m.type === 'error') window.jac.error = m.status;
  if (m.status) status.textContent = m.status;
};
button.onclick = () => {
  running = !running;
  button.textContent = running ? 'Pause' : 'Start';
  worker.postMessage({ type: 'run', running });
};
reset.onclick = () => worker.postMessage({ type: 'reset' });
errorBox.onchange = () => worker.postMessage({ type: 'view', error: errorBox.checked });
roundBox.onchange = () => worker.postMessage({ type: 'round', round: roundBox.checked });
window.jac.start = () => { if (!running) button.click(); };
window.jac.pause = () => { if (running) button.click(); };
window.jac.setError = (on) => { errorBox.checked = on; errorBox.onchange(); };
window.jac.setRound = (on) => { roundBox.checked = on; roundBox.onchange(); };
worker.postMessage({ type: 'init', search: location.search });
</script>
</body>
</html>
