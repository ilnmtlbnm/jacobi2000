[package]
name = "engine"
description = "Jacobi2000 inference off Burn: CPU (single/threads) forward pass reading the same safetensors + config.json checkpoints the PyTorch export writes (docs/pytorch-training.md)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# rayon-parallel CPU path, chosen at runtime by lean-runtime's capability
# ladder, never autotuned.
threads = ["dep:rayon"]

[dependencies]
lean-runtime = { path = "../lean-runtime" }
solvers = { path = "../solvers" }
serde = { workspace = true }
serde_json = { workspace = true }
libm = "0.2"
rayon = { version = "1.10", optional = true }

[dev-dependencies]
# Parity baseline only (tests/parity.rs): builds and exports a random-init
# Burn model to compare this crate's forward pass against. Never a
# production dependency of this crate.
jacobi2000 = { path = "../jacobi2000" }
burn = { version = "0.20", default-features = false, features = ["std", "ndarray"] }
rand = { workspace = true }
