[package]
name = "engine"
description = "Jacobi2000 inference off Burn: CPU (single/threads) forward pass reading the same safetensors + config.json checkpoints the PyTorch export writes (docs/pytorch-training.md)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# rayon-parallel CPU path, chosen at runtime by lean-runtime's capability
# ladder, never autotuned.
threads = ["dep:rayon"]
# WebGPU path: hand-written WGSL kernels (src/shaders/), built on
# lean-runtime's device/buffer/pipeline helpers. Top of the capability
# ladder; falls back to threads/single when no adapter is granted.
wgpu = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
lean-runtime = { path = "../lean-runtime" }
solvers = { path = "../solvers" }
serde = { workspace = true }
serde_json = { workspace = true }
libm = "0.2"
rayon = { version = "1.10", optional = true }
wgpu = { version = "26", optional = true, features = ["fragile-send-sync-non-atomic-wasm"] }
bytemuck = { version = "1.25", optional = true, features = ["derive"] }

[dev-dependencies]
# Blocks on GpuModel::new/forward's async in native tests only.
pollster = "0.4"
