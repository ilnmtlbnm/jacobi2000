[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jacobi2000 = { path = "../jacobi2000" }
solvers = { path = "../solvers" }
train = { path = "../train" }
# The backend is chosen here, in the consumer crate: WebGPU in the tab.
burn = { version = "0.20", default-features = false, features = ["std", "wgpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
serde_json = { workspace = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
# rand 0.8 in the data stack pulls getrandom 0.2, which needs its js feature
# turned on from a crate that actually builds for wasm32.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
