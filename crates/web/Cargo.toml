[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# rayon CPU-threads path (crates/lean-runtime's capability ladder picks it
# when the page is cross-origin isolated with SharedArrayBuffer and more
# than one hardware thread); single CPU thread is the default and always
# available.
threads = ["engine/threads"]

[dependencies]
engine = { path = "../engine" }
solvers = { path = "../solvers" }
lean-runtime = { path = "../lean-runtime" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
